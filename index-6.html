<style>
  :root{
    --pitch-dark:#0D1F17;
    --pitch-mid:#163B29;
    --grass:#2D6A4F;
    --gold:#E8B923;
    --gold-dim:#8a6f1f;
    --paper:#F2EFE6;
    --red:#C1440E;
    --red-dim:#5c2109;
    --blue:#1D5C8A;
    --blue-dim:#0e2c40;
    --line:rgba(242,239,230,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(45,106,79,0.35), transparent 55%),
      var(--pitch-dark);
    color:var(--paper);
    font-family:'Tajawal',sans-serif;
    min-height:100vh;
    padding-bottom:90px;
  }
  h1,h2,h3,.num{font-family:'Cairo',sans-serif;}
  .wrap{max-width:480px;margin:0 auto;padding:16px 14px 8px;}
  header.top{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 14px 10px;position:sticky;top:0;z-index:20;
    background:linear-gradient(var(--pitch-dark) 70%, transparent);

  header.top .brand{font-family:'Cairo',sans-serif;font-weight:900;font-size:19px;letter-spacing:.2px;}
  header.top .brand span{color:var(--gold);}
  .pool-badge{
    font-size:12px;color:var(--paper);opacity:.65;

  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:30;

  nav.tabs button{
    flex:1;background:none;border:none;color:var(--paper);opacity:.5;
    font-family:'Tajawal',sans-serif;font-size:11px;padding:8px 2px;border-radius:10px;
  }
  nav.tabs button.active{opacity:1;background:rgba(232,185,35,0.12);color:var(--gold);font-weight:700;}
  .card{

    padding:16px;

  }
  .card h3{margin:0 0 10px;font-size:15px;color:var(--gold);font-weight:700;}
  .row{display:flex;gap:8px;}

    background:rgba(255,255,255,0.05);

    border-radius:10px;

    font-size:15px;

  button.btn{
    background:var(--gold);

    border:none;
    border-radius:12px;

    font-size:14px;

  button.btn:active{transform:scale(0.98);}
  button.btn.ghost{

  button.btn.danger{background:var(--red);color:var(--paper);}

    display:flex;align-items:center;justify-content:space-between;

  .player-row:last-child{border-bottom:none;}
  .player-row .info{display:flex;flex-direction:column;gap:2px;}
  .player-row .name{font-weight:700;font-size:14.5px;}
  .player-row .meta{font-size:12px;opacity:.65;}
  .stars{color:var(--gold);font-size:12px;letter-spacing:1px;}
  .icon-btn{background:none;border:none;color:var(--paper);opacity:.5;font-size:16px;padding:4px 8px;}

  .position-tag{

  .timer-ring{

    border:4px solid var(--line);
  }

  .bid-display{
    font-family:'Cairo',sans-serif;font-weight:900;font-size:38px;color:var(--gold);

  }
  .turn-banner.red{background:var(--red-dim);color:#ffb08a;}
  .turn-banner.blue{background:var(--blue-dim);color:#9fd6ff;}

  .budget-box{flex:1;border-radius:12px;padding:8px 10px;text-align:center;}

  .budget-box.blue{background:var(--blue-dim);}
  .budget-box .lbl{font-size:11px;opacity:.8;}

  .stat-actions{display:flex;align-items:center;gap:3px;flex-shrink:0;}
  .stat-btn{width:28px;height:28px;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.06);color:var(--paper);font-size:17px;line-height:1;padding:0;font-family:Arial,sans-serif;}
  .stat-btn:active{transform:scale(.94);}
  .stat-btn.plus{color:#77e2a6;}
  .stat-btn.minus{color:#ff8c70;}
  .stat-value{min-width:18px;text-align:center;font-family:'Cairo',sans-serif;font-weight:800;font-size:13px;}
  .player-points{font-family:'Cairo',sans-serif;font-size:11px;font-weight:800;color:var(--gold);min-width:44px;text-align:left;}
  .results-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .results-header h3{margin:0;}
  .results-note{font-size:11px;opacity:.62;line-height:1.6;}
  @media(max-width:360px){.stat-grid{grid-template-columns:1fr;}.match-summary{gap:5px}.summary-box{padding:8px 4px}}
  .formation-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .formation-team{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:rgba(0,0,0,.12);}
  .formation-head{padding:10px;text-align:center;background:rgba(255,255,255,.035);}
  .formation-pitch{padding:10px 7px;background:linear-gradient(180deg,rgba(45,106,79,.38),rgba(22,59,41,.5));min-height:245px;display:flex;flex-direction:column;justify-content:space-around;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .formation-line{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;min-height:34px;align-items:center;}
  .formation-player{background:rgba(6,15,11,.72);border:1px solid rgba(242,239,230,.16);border-radius:10px;padding:6px 5px;text-align:center;font-size:11px;min-width:54px;max-width:88px;display:flex;flex-direction:column;gap:2px;}
  .formation-player small{font-size:9px;opacity:.55;}
  .formation-empty{opacity:.2;font-size:16px;}
  .bench-box{padding:9px;background:rgba(0,0,0,.16);}
  .bench-title{font-family:'Cairo',sans-serif;color:var(--gold);font-size:11px;font-weight:800;margin-bottom:5px;text-align:center;}
  .bench-player{max-width:none;width:100%;margin-bottom:5px;display:flex;flex-direction:row;justify-content:space-between;align-items:center;text-align:right;}
  .bench-player:last-child{margin-bottom:0;}
  @media(max-width:360px){.formation-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<script>
(function(){

// ---------- helpers ----------
const POSITIONS = ["حارس مرمى","مدافع","وسط","مهاجم"];
const DEFAULT_QUOTA = {"حارس مرمى":1,"مدافع":2,"وسط":2,"مهاجم":1}; // per team, per booking — captain counts toward these 6 spots
const INITIAL_ROSTER = [
  { id:"p01", name:"يوسف",        position:"حارس مرمى", rating:40, apps:0, goals:0, assists:0, saves:0, penaltySaves:0, yellowCards:0, redCards:0, mvpMatches:0, mvpBookings:0, cleanSheets:0, tackles:0, missedPenalties:0, penaltiesConceded:0, ratingHistory:[] },

  { id:"p08", name:"ريان",        position:"وسط",       rating:40, apps:0, goals:0, assists:0, saves:0, penaltySaves:0, yellowCards:0, redCards:0, mvpMatches:0, mvpBookings:0, cleanSheets:0, tackles:0, missedPenalties:0, penaltiesConceded:0, ratingHistory:[] },
  { id:"p09", name:"محمد",        position:"وسط",       rating:40, apps:0, goals:0, assists:0, saves:0, penaltySaves:0, yellowCards:0, redCards:0, mvpMatches:0, mvpBookings:0, cleanSheets:0, tackles:0, missedPenalties:0, penaltiesConceded:0, ratingHistory:[] },
  { id:"p10", name:"عمر أحمد",    position:"وسط",       rating:40, apps:0, goals:0, assists:0, saves:0, penaltySaves:0, yellowCards:0, redCards:0, mvpMatches:0, mvpBookings:0, cleanSheets:0, tackles:0, missedPenalties:0, penaltiesConceded:0, ratingHistory:[] },
  { id:"p11", name:"مالك",        position:"مهاجم",     rating:40, apps:0, goals:0, assists:0, saves:0, penaltySaves:0, yellowCards:0, redCards:0, mvpMatches:0, mvpBookings:0, cleanSheets:0, tackles:0, missedPenalties:0, penaltiesConceded:0, ratingHistory:[] },
  { id:"p12", name:"أمير",        position:"مهاجم",     rating:40, apps:0, goals:0, assists:0, saves:0, penaltySaves:0, yellowCards:0, redCards:0, mvpMatches:0, mvpBookings:0, cleanSheets:0, tackles:0, missedPenalties:0, penaltiesConceded:0, ratingHistory:[] },
  { id:"p13", name:"أحمد هاني",   position:"مهاجم",     rating:40, apps:0, goals:0, assists:0, saves:0, penaltySaves:0, yellowCards:0, redCards:0, mvpMatches:0, mvpBookings:0, cleanSheets:0, tackles:0, missedPenalties:0, penaltiesConceded:0, ratingHistory:[] },
];
const uid = () => Math.random().toString(36).slice(2,10);
const clone = (o) => JSON.parse(JSON.stringify(o));

// تطبيع حالة الحجز القادمة من Firebase. مهم جدًا في الـMultiplayer لأن
// الموبايلين ممكن يقروا نسخة قديمة/ناقصة من الحالة في نفس اللحظة.
function normalizeBooking(raw){
  if(!raw || typeof raw !== "object") return null;
  const base = freshBooking ? freshBooking(DEFAULT_QUOTA) : null;
  const b = Object.assign(base || {}, clone(raw));
  if(!b.bookingId) b.bookingId = "legacy-" + String(b.captainRed||"") + "-" + String(b.captainBlue||"");
  if(!Array.isArray(b.matches)) b.matches = [];
  b.matchesClosed = !!b.matchesClosed;
  b.bookingMvpAwarded = !!b.bookingMvpAwarded;
  b.squads = b.squads && typeof b.squads === "object" ? b.squads : {};
  b.squads.red = Array.isArray(b.squads.red) ? b.squads.red : [];
  b.squads.blue = Array.isArray(b.squads.blue) ? b.squads.blue : [];
  b.budgets = b.budgets && typeof b.budgets === "object" ? b.budgets : {red:100,blue:100};
  if(typeof b.budgets.red !== "number") b.budgets.red = 100;
  if(typeof b.budgets.blue !== "number") b.budgets.blue = 100;
  b.poolIds = Array.isArray(b.poolIds) ? b.poolIds : [];
  b.availablePlayerIds = Array.isArray(b.availablePlayerIds) ? b.availablePlayerIds : [];
  if(!b.teamSize) b.teamSize = Number(b.availablePlayerIds.length) === 11 ? 5 : 6;
  if(!b.benchTarget) b.benchTarget = (Number(b.availablePlayerIds.length) === 11 || Number(b.availablePlayerIds.length) === 13) ? 1 : 0;
  b.log = Array.isArray(b.log) ? b.log : [];
  b.quota = b.quota && typeof b.quota === "object" ? b.quota : clone(DEFAULT_QUOTA);
  b.need = b.need && typeof b.need === "object" ? b.need : {red:clone(b.quota),blue:clone(b.quota)};
  b.need.red = b.need.red && typeof b.need.red === "object" ? b.need.red : clone(b.quota);
  b.need.blue = b.need.blue && typeof b.need.blue === "object" ? b.need.blue : clone(b.quota);
  return b;
}
const esc = (s) => (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const FIREBASE_DB_URL = "https://mazad-el7agz-fff35-default-rtdb.europe-west1.firebasedatabase.app/official";

async function loadShared(key, fallback){
  try{
    const res = await fetch(FIREBASE_DB_URL + "/" + encodeURIComponent(key) + ".json", { cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const val = await res.json();
    return { ok:true, value: (val===null || val===undefined) ? fallback : val };
  }catch(e){
    // أي فشل في القراءة — منسيبهاش تمسح البيانات المحلية الموجودة عندنا
    return { ok:false, value: fallback };
  }
}
let storageWarnShown = false;
async function saveShared(key, value){
  try{
    const res = await fetch(FIREBASE_DB_URL + "/" + encodeURIComponent(key) + ".json", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(value === undefined ? null : value)
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return true;
  }catch(e){
    if(!storageWarnShown){
      storageWarnShown = true;
      showToast("⚠️ في مشكلة في الاتصال بقاعدة البيانات دلوقتي");
    }
    return false;
  }
}

// ---------- state ----------
let state = {
  tab: "roster",
  roster: [],           // {id,name,position,rating(40-100),ratingHistory,archived,...stats}
  booking: null,        // active/last booking object or null
  history: [],          // legacy/global match history
  bookingHistory: [],   // completed bookings with their match-by-match history
  openBookingHistoryId: null, // keep the expanded old booking open during polling
  openBookingAuctionEventsId: null, // keep "أحداث المزاد" open during polling
  myTeam: null,         // 'red' | 'blue' (local only, not shared)
  myCaptainId: null,    // local identity for this device
  toast: null,
  matchForm: null, // keep unsaved match stats safe while the realtime polling rerenders the page
  attendanceSelecting: false,
  attendanceSelectedIds: [],
  rosterMigrationSaved: false,
};

let pollTimer = null;
let toastTimer = null;

function showToast(msg){
  state.toast = msg;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ state.toast=null; render(); }, 2600);
}

// أنيميشن الروليت — بيتحط على الـ body مباشرة عشان مايتمسحش مع أي render() تاني
function playRouletteAnimation(candidateLabels, resultLabel, titleText){
  return new Promise(resolve=>{
    const labels = candidateLabels.length ? candidateLabels : [resultLabel];
    const overlay = document.createElement("div");
    overlay.className = "roulette-overlay";
    overlay.innerHTML = `<div class="roulette-box">
      <div class="roulette-title">${esc(titleText||"🎰 بيدور...")}</div>
      <div class="roulette-name" id="roulette-spin-name">...</div>
    </div>`;
    document.body.appendChild(overlay);
    const nameEl = overlay.querySelector("#roulette-spin-name");
    let elapsed = 0;
    let interval = 80;
    const totalDuration = 1500;
    function tick(){
      nameEl.textContent = labels[Math.floor(Math.random()*labels.length)];
      elapsed += interval;
      interval = Math.min(interval * 1.18, 260);
      if(elapsed < totalDuration){
        setTimeout(tick, interval);
      } else {
        nameEl.textContent = resultLabel;
        nameEl.classList.add("landed");
        setTimeout(()=>{
          if(overlay.parentNode) document.body.removeChild(overlay);
          resolve();
        }, 750);
      }
    }
    tick();
  });
}

// ---------- booking / auction logic ----------
function freshBooking(quota){
  const totalPerTeam = Object.values(quota).reduce((a,b)=>a+b,0);
  return {
    bookingId: "booking-" + uid(),
    bookingNumber: null,
    phase: "captains",             // captains | drafting | roulette | done
    quota: quota,
    captainRed: null,
    captainBlue: null,
    need: { red: clone(quota), blue: clone(quota) },
    budgets: { red: 100, blue: 100 },
    squads: { red: [], blue: [] },
    availablePlayerIds: [],

function weightedPick(players){
  // روليت التعويض تعتمد على النسب المتفق عليها، وليس على المركز.
  // النسب الأساسية للاعبين الـ11، واللاعبون الإضافيون يستخدمون وزنًا مبنيًا على التقييم.
  const rouletteWeights = {
    p12: 3,  // أمير ⭐⭐⭐⭐⭐
    p10: 3,  // عمر أحمد ⭐⭐⭐⭐⭐
    p03: 6,  // أحمد إبراهيم ⭐⭐⭐⭐
    p07: 6,  // عمر وليد ⭐⭐⭐⭐
    p06: 7,  // إياد سامح ⭐⭐⭐⭐
    p11: 7,  // مالك ⭐⭐⭐⭐
    p09: 12, // محمد ⭐⭐⭐
    p08: 11, // ريان ⭐⭐⭐
    p01: 13, // يوسف ⭐⭐
    p05: 16, // بدر ⭐
    p04: 16  // ياسين ⭐
  };
  const weights = players.map(p => rouletteWeights[p.id] ?? Math.pow(p.rating, 2));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<players.length;i++){
    r -= weights[i];
    if(r<=0) return players[i];
  }
  return players[players.length-1];
}

function pickNextPlayer(b){
  // مفيش قيد مراكز في اختيار لاعب المزاد. أي لاعب متبقّي ممكن يدخل المزاد.
  const candidates = state.roster.filter(p => b.poolIds.includes(p.id));
  if(candidates.length===0) return null;
  return weightedPick(candidates);
}

async function startRepeatedBooking(source){
  if(!source || !source.squads || !Array.isArray(source.squads.red) || !Array.isArray(source.squads.blue)){
    alert("مش قادر أقرأ تشكيلة الحجز القديم.");
    return;
  }
  if(state.booking && state.booking.phase!=="done"){
    alert("فيه حجز شغال دلوقتي — خلصه أو ألغيه الأول.");
    return;
  }

  const resolveId = value => {
    if(value==null) return null;
    if(typeof value === "object") return value.id || value.playerId || value.uid || null;
    return value;
  };
  const findRosterPlayer = id => state.roster.find(p=>String(p.id)===String(id) || String(p.name)===String(id));
  const makeCompleteSquad = team => {
    const raw = clone(Array.isArray(source.squads[team]) ? source.squads[team] : []);
    const captainRaw = team==="red"
      ? (source.captainRed ?? source.redCaptain ?? source.captain?.red ?? source.captains?.red)
      : (source.captainBlue ?? source.blueCaptain ?? source.captain?.blue ?? source.captains?.blue);
    const captainId = resolveId(captainRaw);
    const marked = raw.find(p=>p && (p.isCaptain || p.captain));
    const markedId = marked ? resolveId(marked.id) : null;
    let finalCaptainId = captainId || markedId;
    const captainPlayer = finalCaptainId!=null ? (raw.find(p=>p && (String(p.id)===String(finalCaptainId) || String(p.name)===String(finalCaptainId))) || findRosterPlayer(finalCaptainId)) : null;
    if(captainPlayer) finalCaptainId = captainPlayer.id;
    raw.forEach(p=>{ if(p) p.isCaptain = finalCaptainId!=null && String(p.id)===String(finalCaptainId); });
    // الحجوزات الجديدة بتخزن الكابتن جوه الـsquad، لكن بعض الحجوزات القديمة كانت بتخزن 6 لاعبين في الـsquad والكابتن في captainRed/captainBlue بشكل منفصل. في الحالة دي ما نزودش لاعب سابع؛ نحافظ على التشكيلة كما ظهرت.
    if(finalCaptainId!=null && !raw.some(p=>p && String(p.id)===String(finalCaptainId)) && raw.length<6){
      const cap=findRosterPlayer(finalCaptainId);
      if(cap) raw.unshift({id:cap.id,name:cap.name,position:cap.position,rating:cap.rating||0,price:0,isCaptain:true});
    }
    return raw;
  };

  const completeRed=makeCompleteSquad("red"), completeBlue=makeCompleteSquad("blue");
  // الحجز الكامل: كل فريق أساسي = 6 لاعبين (كابتن + 5)، ولو كان الحجز 13 لاعبًا ففريق واحد منهم يكون معه لاعب دكة، فيبقى فريقه 7 لاعبين.
  // لذلك الحجز المتكرر يقبل 6/6 لحجز 12 لاعبًا أو 6/7 لحجز 13 لاعبًا، ويحافظ على التشكيلة كما هي بدون إضافة لاعب زائد.
  // الحجز الصحيح: كل فريق عنده 6 أساسيين (كابتن + 5).
  // لو كان الحجز بـ13 لاعب، فريق واحد فقط ممكن يكون عنده لاعب دكة، فيبقى إجمالي لاعبيه 7.
  // بعض البيانات القديمة قد تعتبر لاعب الدكة ضمن الـsquad، لذلك التحقق الأساسي هنا على الـ6 الأساسيين.
  const redStarters = completeRed.filter(p=>p && !p.isBench);
  const blueStarters = completeBlue.filter(p=>p && !p.isBench);
  const totalPlayers = completeRed.length + completeBlue.length;
  const hasValidTeams = (redStarters.length===6 && blueStarters.length===6) || (redStarters.length===5 && blueStarters.length===5);
  const hasValidBenchCount = (totalPlayers===10 && redStarters.length===5 && blueStarters.length===5) ||
    (totalPlayers===11 && redStarters.length===5 && blueStarters.length===5 && ((completeRed.length===6 && completeBlue.length===5) || (completeRed.length===5 && completeBlue.length===6))) ||
    (totalPlayers===12 && redStarters.length===6 && blueStarters.length===6) ||
    (totalPlayers===13 && redStarters.length===6 && blueStarters.length===6 && ((completeRed.length===7 && completeBlue.length===6) || (completeRed.length===6 && completeBlue.length===7)));
  const validSquads = hasValidTeams && hasValidBenchCount;
  if(!validSquads){
    alert(`الحجز القديم مش مكتمل. المطلوب: 5+5 أو 5+5+دكة أو 6+6 أو 6+6+دكة.`);
    return;
  }

  const b=freshBooking(DEFAULT_QUOTA);
  b.bookingNumber=await getNextBookingNumber();
  b.phase="done";
  b.captainRed=(completeRed.find(p=>p.isCaptain)||{}).id || resolveId(source.captainRed ?? source.redCaptain ?? source.captain?.red ?? source.captains?.red);
  b.captainBlue=(completeBlue.find(p=>p.isCaptain)||{}).id || resolveId(source.captainBlue ?? source.blueCaptain ?? source.captain?.blue ?? source.captains?.blue);
  b.squads={red:completeRed,blue:completeBlue};
  b.availablePlayerIds=[...completeRed,...completeBlue].map(p=>p.id);
  b.teamSize=(completeRed.filter(p=>!p.isBench).length===5 && completeBlue.filter(p=>!p.isBench).length===5)?5:6;
  b.benchTarget=(completeRed.length+completeBlue.length===11 || completeRed.length+completeBlue.length===13)?1:0;
  b.budgets={red:100,blue:100};
  b.need={red:{...clone(DEFAULT_QUOTA)},blue:{...clone(DEFAULT_QUOTA)}};
  b.matches=[];
  b.matchesClosed=false;
  b.bookingMvpAwarded=false;
  b.completedAt=new Date().toISOString();
  resetLocalCaptainIdentity();
  state.booking=b;
  state.tab="results";
  state.matchForm=null;
  render();
  await saveShared("current-booking",b);
  await archiveCompletedBooking(b);
  render();
  showToast("اتعمل حجز جديد بنفس التشكيلة 🔄");
}

async function chooseCaptain(playerId){
  try{
    const fresh = await loadShared("current-booking", state.booking);
    const b = normalizeBooking(fresh.value);
    if(!b || b.phase!=="captains") return;
    // كل موبايل له هوية كابتن محلية؛ بعد ما تختار كابتنك، ممنوع تتحكم
    // في الكابتن التاني أو تغيّر الفريق من نفس الجهاز.
    restoreLocalTeam(b);
    if(state.myCaptainId && (b.captainRed===state.myCaptainId || b.captainBlue===state.myCaptainId)){
      alert("إنت اخترت كابتنك خلاص — الموبايل ده مسؤول عن فريقك بس.");
      return;
    }
    const availableIds = new Set(Array.isArray(b.availablePlayerIds) ? b.availablePlayerIds : state.roster.filter(p=>!p.archived).map(p=>p.id));
    if(!availableIds.has(playerId)){ alert("اللاعب ده مش متسجل ضمن الحاضرين في الحجز ده."); return; }
    if(b.captainRed===playerId){ alert("انت متسجل كابتن الأحمر خلاص"); return; }
    if(b.captainBlue===playerId){ alert("انت متسجل كابتن الأزرق خلاص"); return; }
    if(b.captainRed && b.captainBlue){ alert("الكباتن اتحددوا خلاص"); return; }

    if(!b.captainRed){
      b.captainRed = playerId;
      state.myTeam = "red";
      state.myCaptainId = playerId;
      try{ localStorage.setItem("mazad-my-captain-official", playerId); }catch(e){}
    } else if(!b.captainBlue){
      b.captainBlue = playerId;
      state.myTeam = "blue";
      state.myCaptainId = playerId;
      try{ localStorage.setItem("mazad-my-captain-official", playerId); }catch(e){}
    } else {
      alert("الكباتن اتحددوا خلاص");
      return;
    }
    state.booking = b;
    render();
    await saveShared("current-booking", b);

    if(b.captainRed && b.captainBlue){
      await beginDraft();
    }
  }catch(e){
    alert("حصل خطأ وإحنا بنختار الكابتن: " + e.message);
  }
}

async function beginDraft(){
 try{
  // اقرأ أحدث نسخة مرة أخرى قبل بدء المزاد. ده يمنع الموبايلين من تشغيل
  // بداية المزاد على نسخة قديمة في نفس الوقت.
  const fresh = await loadShared("current-booking", state.booking);
  const b = normalizeBooking(fresh.value);
  if(!b || b.phase!=="captains" || !b.captainRed || !b.captainBlue) return;
  // لو جهاز تاني بدأ المزاد بالفعل، متبدأش نسخة ثانية فوقه.
  if(b.currentPlayerId || b.phase!=="captains") return;

  const excluded = [b.captainRed, b.captainBlue];
  const availableIds = Array.isArray(b.availablePlayerIds) && b.availablePlayerIds.length ? b.availablePlayerIds : state.roster.filter(p=>!p.archived).map(p=>p.id);
  const availableSet = new Set(availableIds);
  const remaining = state.roster.filter(p => availableSet.has(p.id) && !excluded.includes(p.id) && !p.archived);

  const capRed = state.roster.find(p=>p.id===b.captainRed);
  const capBlue = state.roster.find(p=>p.id===b.captainBlue);
  if(!capRed || !capBlue){
    alert("مش لاقي بيانات أحد الكباتن في قايمة اللاعبين — جرب تحدّث الصفحة وحاول تاني.");
    return;
  }

  // المراكز معلومات فقط؛ مفيش حد أقصى لأي مركز في الروليت أو المزاد.
  // كل كابتن يبدأ بلاعبه، وبعدها كل جولة تضيف لاعبًا للمزاد أو لاعب تعويض،
  // حتى يصل كل فريق إلى 5 لاعبين غير الكابتن.
  const needRed = { ...clone(b.quota) };
  const needBlue = { ...clone(b.quota) };

  b.squads.red.push({ id:capRed.id, name:capRed.name, position:capRed.position, price:0, isCaptain:true });
  b.squads.blue.push({ id:capBlue.id, name:capBlue.name, position:capBlue.position, price:0, isCaptain:true });
  b.poolIds = remaining.map(p=>p.id);
  b.need = { red: needRed, blue: needBlue };

  // اختيار أول لاعب بشكل ثابت عند بداية الغرفة، حتى لو الموبايلين
  // نفذوا beginDraft في نفس اللحظة مايحصلش تعارض وتظهر لاعبين مختلفين.
  const firstPool = remaining.slice().sort((a,z)=>String(a.id).localeCompare(String(z.id)));
  const seedText = String(b.captainRed) + ":" + String(b.captainBlue);
  let seed = 0;
  for(let i=0;i<seedText.length;i++) seed = (seed * 31 + seedText.charCodeAt(i)) >>> 0;
  const first = firstPool.length ? firstPool[seed % firstPool.length] : null;
  if(!first){ alert("في مشكلة في اختيار أول لاعب للمزاد"); return; }
  b.currentPlayerId = first.id;
  b.starter = "red";
  b.turnTeam = "red";
  b.deadline = new Date(Date.now()+30000).toISOString();
  b.phase = "drafting";
  state.booking = b;
  render();
  await saveShared("current-booking", b);
 }catch(e){
  alert("حصل خطأ وإحنا بنبدأ المزاد: " + e.message);
 }
}

function restoreLocalTeam(b){
  if(!b) return;
  let id = state.myCaptainId;
  if(!id){ try{ id = localStorage.getItem("mazad-my-captain-official"); }catch(e){} }
  if(id && id===b.captainRed){ state.myCaptainId=id; state.myTeam = "red"; }
  else if(id && id===b.captainBlue){ state.myCaptainId=id; state.myTeam = "blue"; }
  else if(b.phase==="captains" && id && b.captainRed && b.captainBlue){
    // الهوية القديمة لا تنتمي للحجز الحالي؛ سيقدر المستخدم يختار كابتنه الجديد.
    state.myCaptainId=null; state.myTeam=null;
  }
}

function assertMyTurn(b){
  restoreLocalTeam(b);
  if(!state.myTeam){
    alert("حدد كابتنك من نفس الجهاز الأول عشان نعرف إنت الأحمر ولا الأزرق.");
    return false;
  }
  if(b.turnTeam !== state.myTeam){
    alert("مش دور فريقك دلوقتي.");
    return false;
  }
  return true;
}

function calculateBookingMVP(b){
  const players = [...(b?.squads?.red||[]), ...(b?.squads?.blue||[])];
  const totals = {};
  players.forEach(p=>{ totals[p.id] = { player:p, points:0, goals:0, assists:0, saves:0, penaltySaves:0, yellowCards:0, redCards:0 }; });
  (b?.matches||[]).forEach(m=>{
    const d=m.data||{};
    players.forEach(p=>{
      const t=totals[p.id];
      if(!t) return;
      t.points += playerMatchRating(p,d);
      t.goals += Number(d.goals?.[p.id]||0);
      t.assists += Number(d.assists?.[p.id]||0);
      t.saves += Number(d.saves?.[p.id]||0);
      t.penaltySaves += Number(d.pensaves?.[p.id]||0);
      t.yellowCards += Number(d.yellowCards?.[p.id]||0);
      t.redCards += Number(d.redCards?.[p.id]||0);
    });
  });
  const list=Object.values(totals);
  if(!list.length) return null;
  list.sort((a,b)=> (b.points-a.points) || (b.goals-a.goals) || (b.assists-a.assists) || (b.saves-a.saves) || (b.penaltySaves-a.penaltySaves) || (a.yellowCards-b.yellowCards) || (a.redCards-b.redCards) || a.player.name.localeCompare(b.player.name,'ar'));
  if(list[0].points<=0) return null;
  const x=list[0];
  return {id:x.player.id,name:x.player.name,rating:x.points};
}

async function awardBookingMVP(b, roster){
  if(!b || b.bookingMvpAwarded || !Array.isArray(b.matches) || !b.matches.length) return null;
  const mvp=calculateBookingMVP(b);
  if(mvp){
    const p=roster.find(r=>r.id===mvp.id);
    if(p) p.mvpBookings=(p.mvpBookings||0)+1;
    b.bookingMvp={...mvp};
  } else {
    b.bookingMvp=null;
  }
  b.bookingMvpAwarded=true;
  return mvp;
}

async function archiveCompletedBooking(b){
  if(!b || b.phase!=="done") return;
  const res = await loadShared("booking-history", []);
  const hist = res.ok && Array.isArray(res.value) ? res.value : [];
  const snapshot = {
    id: b.bookingId,
    number: b.bookingNumber || (hist.length+1),
    date: b.completedAt || new Date().toISOString(),
    captainRed: b.captainRed, captainBlue: b.captainBlue,
    squads: clone(b.squads),
    log: clone(b.log || []),
    matches: clone(b.matches || []),
    bookingMvp: clone(b.bookingMvp || null),
    bookingMvpAwarded: !!b.bookingMvpAwarded
  };
  const idx = hist.findIndex(x=>x && x.id===snapshot.id);
  if(idx>=0) hist[idx] = snapshot; else hist.unshift(snapshot);
  hist.sort((a,b)=>Number(b.number||0)-Number(a.number||0));
  state.bookingHistory = hist;
  await saveShared("booking-history", hist);
}

async function placeBid(amount){
  const fresh = await loadShared("current-booking", state.booking);
  const b = normalizeBooking(fresh.value);
  if(!b || b.phase!=="drafting") return;
  if(!assertMyTurn(b)) return;
  const team = b.turnTeam;
  const other = team==="red"?"blue":"red";
  if(amount < 1 || amount > 100 || !Number.isInteger(amount)){
    alert("الرقم لازم يكون صحيح من 1 لـ100"); return;
  }
  if(amount > b.budgets[team]){
    alert("مفيش عندك رصيد كفاية"); return;
  }
  if(amount <= b.currentBid){
    alert("لازم تزود عن الرقم الحالي"); return;
  }
  b.currentBid = amount;
  b.currentBidder = team;
  b.turnTeam = other;
  b.deadline = new Date(Date.now()+30000).toISOString();
  state.booking = b;
  render();
  await saveShared("current-booking", b);
}

async function concedePlayer(){
  const fresh = await loadShared("current-booking", state.booking);
  const b = normalizeBooking(fresh.value);
  if(!b || b.phase!=="drafting" || !b.currentBidder) return;
  restoreLocalTeam(b);
  if(state.myTeam !== b.turnTeam) { alert("مش دور فريقك دلوقتي."); return; }
  await finalizeRound(b);
}

async function finalizeRound(b){
  b = normalizeBooking(b);
  if(!b) return;
  const winner = b.currentBidder;
  const loser = winner==="red" ? "blue" : "red";
  const player = state.roster.find(p=>p.id===b.currentPlayerId);

  // الفريق الفايز ياخد اللاعب ويدفع فيه (بيتحط على طول، مفيش حظ هنا)
  b.budgets[winner] -= b.currentBid;
  b.squads[winner].push({ id: player.id, name: player.name, position: player.position, price: b.currentBid });
  b.poolIds = b.poolIds.filter(id=>id!==player.id);
  b.log.unshift((winner==="red"?"الفريق الأحمر":"الفريق الأزرق") + " اخد " + player.name + " بـ " + b.currentBid + " مليون");

  // الفريق الخاسر ياخد لاعب تعويض ببلاش من روليت موزونة.
  // المراكز لا تدخل في اختيار التعويض نهائيًا؛ الاختيار يعتمد على النسب المتفق عليها.
  const loserCandidates = state.roster.filter(p => b.poolIds.includes(p.id));
  if(loserCandidates.length > 0){
    const freePlayer = weightedPick(loserCandidates);
    await playRouletteAnimation(
      loserCandidates.map(p=>p.name),
      freePlayer.name,
      "🎁 روليت تعويض الفريق " + (loser==="red"?"الأحمر":"الأزرق")
    );
    b.squads[loser].push({ id: freePlayer.id, name: freePlayer.name, position: freePlayer.position, price: 0, isConsolation:true });
    b.poolIds = b.poolIds.filter(id=>id!==freePlayer.id);
    b.log.unshift("🎁 روليت التعويض جابت لفريق "+(loser==="red"?"الأحمر":"الأزرق")+" اللاعب "+freePlayer.name+" ببلاش");
  } else {
    b.log.unshift("⚠️ مفيش لاعب مناسب للروليت التعويضي لفريق "+(loser==="red"?"الأحمر":"الأزرق")+" الجولة دي");
  }

  b.round += 1;

  const target = Number(b.teamSize || 6);
  const teamsFull = b.squads.red.filter(p=>!p.isBench).length >= target && b.squads.blue.filter(p=>!p.isBench).length >= target;
  if(teamsFull){
    b.phase = (Number(b.benchTarget||0) > 0 && b.poolIds.length>0) ? "final_roulette" : "done";
    b.currentPlayerId = null; b.currentBid = 0; b.currentBidder = null; b.deadline = null;
  } else {
    const next = pickNextPlayer(b);
    if(!next){
      b.phase = (Number(b.benchTarget||0) > 0 && b.poolIds.length>0) ? "final_roulette" : "done";
      b.currentPlayerId = null; b.currentBid = 0; b.currentBidder = null; b.deadline = null;
    }else{
      b.currentPlayerId = next.id;
      b.currentBid = 0;
      b.currentBidder = null;
      b.starter = b.starter==="red"?"blue":"red";
      b.turnTeam = b.starter;
      b.deadline = new Date(Date.now()+30000).toISOString();
    }
  }
  if(b.phase === "done"){
    b.completedAt = b.completedAt || new Date().toISOString();
    await archiveCompletedBooking(b);
  }
  state.booking = b;
  render();
  await saveShared("current-booking", b);
}

async function runFinalRoulette(){
  let b = clone(state.booking);
  // بعد اكتمال 5 لاعبين لكل كابتن، المفروض يفضل لاعب واحد فقط (الـ13).
  // الروليت النهائية تختار الفريق فقط، ولا تعيد توزيع باقي اللاعبين.
  if(b.phase !== "final_roulette") return;
  if(b.poolIds.length !== 1){
    alert("في مشكلة في عدد اللاعبين المتبقيين. المفروض يفضل لاعب واحد فقط قبل الروليت النهائية.");
    return;
  }

  const nextId = b.poolIds[0];
  const player = state.roster.find(p=>p.id===nextId);
  if(!player){
    alert("اللاعب المتبقي مش موجود في قاعدة البيانات");
    return;
  }

  const winTeam = Math.random() < 0.5 ? "red" : "blue";
  await playRouletteAnimation(
    ["الفريق الأحمر", "الفريق الأزرق"],
    winTeam==="red" ? "الفريق الأحمر" : "الفريق الأزرق",
    "🎰 مين هياخد لاعب الدكة؟"
  );

  // اللاعب رقم 13 دكة فقط، ومركزه لا يدخل في حساب التشكيلة الأساسية.
  b.squads[winTeam].push({ id: player.id, name: player.name, position: player.position, price: 0, isFinalRoulette:true, isBench:true });
  b.poolIds = [];
  b.log.unshift("🎰 الروليت النهائية وقعت لصالح الفريق "+(winTeam==="red"?"الأحمر":"الأزرق")+" — "+player.name+" (دكة)");
  b.phase = "done";
  b.completedAt = b.completedAt || new Date().toISOString();
  await archiveCompletedBooking(b);
  state.booking = b;
  render();
  await saveShared("current-booking", b);
}

async function checkTimeout(){
  const b = normalizeBooking(state.booking);
  if(!b || b.phase!=="drafting" || !b.deadline) return;
  if(Date.now() < new Date(b.deadline).getTime()) return;
  const bb = clone(b);
  if(bb.currentBidder){
    // responder timed out -> auto concede
    await finalizeRound(bb);
  } else {
    // starter timed out with no bid yet -> force minimum bid of 1
    bb.currentBid = 1;
    bb.currentBidder = bb.turnTeam;
    bb.turnTeam = bb.turnTeam==="red"?"blue":"red";
    bb.deadline = new Date(Date.now()+30000).toISOString();
    state.booking = bb;
    render();
    await saveShared("current-booking", bb);
  }
}

// ---------- match ratings / MVP ----------
// تقييم موحد للماتش: الأهداف والأسيستات والتصديات والتصدي لركلة الجزاء
// تضيف نقاط، بينما الإنذار والطرد يخصمان نقاطًا.
const PERFORMANCE_POINTS = { goal:3, assist:2, save:1, penaltySave:3, cleanSheet:2, block:2, missedPenalty:-3, penaltyConceded:-2, yellow:-1, red:-3, mvp:3 };
function playerMatchBaseRating(player, data){
  const id = player.id;
  return (Number(data.goals?.[id]||0) * PERFORMANCE_POINTS.goal)
       + (Number(data.assists?.[id]||0) * PERFORMANCE_POINTS.assist)
       + (Number(data.saves?.[id]||0) * PERFORMANCE_POINTS.save)
       + (Number(data.pensaves?.[id]||0) * PERFORMANCE_POINTS.penaltySave)
       + (Number(data.cleanSheets?.[id]||0) * PERFORMANCE_POINTS.cleanSheet)
       + (Number(data.tackles?.[id]||0) * PERFORMANCE_POINTS.block)
       + (Number(data.missedPenalties?.[id]||0) * PERFORMANCE_POINTS.missedPenalty)
       + (Number(data.penaltiesConceded?.[id]||0) * PERFORMANCE_POINTS.penaltyConceded)
       + (Number(data.yellowCards?.[id]||0) * PERFORMANCE_POINTS.yellow)
       + (Number(data.redCards?.[id]||0) * PERFORMANCE_POINTS.red);
}
function playerMatchRating(player, data){
  return playerMatchBaseRating(player, data) + (data.mvpId===player.id ? PERFORMANCE_POINTS.mvp : 0);
}
function calculateMVP(players, data){
  if(!players.length) return null;
  const maxRating = Math.max(...players.map(p=>playerMatchBaseRating(p,data)));
  if(maxRating <= 0) return null; // لو الماتش مفيهوش مساهمات موجبة، مفيش MVP مصطنع.
  return [...players].sort((a,b)=>{
    const rb=playerMatchBaseRating(b,data), ra=playerMatchBaseRating(a,data);
    if(rb!==ra) return rb-ra;
    const gb=Number(data.goals?.[b.id]||0), ga=Number(data.goals?.[a.id]||0);
    if(gb!==ga) return gb-ga;
    const ab=Number(data.assists?.[b.id]||0), aa=Number(data.assists?.[a.id]||0);
    if(ab!==aa) return ab-aa;
    const sb=Number(data.saves?.[b.id]||0), sa=Number(data.saves?.[a.id]||0);
    if(sb!==sa) return sb-sa;
    const yb=Number(data.yellowCards?.[b.id]||0), ya=Number(data.yellowCards?.[a.id]||0);
    if(yb!==ya) return ya-yb;
    return a.name.localeCompare(b.name,'ar');
  })[0];
}

// تحويل نقاط الحجز بالكامل إلى Rating: يتحدث مرة واحدة عند إنهاء كل حجز، مهما كان عدد ماتشات الحجز (من 1 إلى 5). المتوسط هو أساس التقييم، وليس عدد الماتشات.
function bookingRatingDelta(avg){
  if(avg >= 10) return 4;
  if(avg >= 7) return 3;
  if(avg >= 4) return 2;
  if(avg >= 2) return 1;
  if(avg >= 0) return 0;
  if(avg >= -3) return -1;
  if(avg >= -6) return -2;
  return -3;
}
function calculateBookingPerformance(b, player){
  const matches=Array.isArray(b?.matches)?b.matches:[];
  if(!matches.length) return {total:0, average:0, matches:0};
  let total=0, played=0;
  matches.forEach(m=>{
    const d=m.data||{};
    const score=playerMatchBaseRating(player,d) + (m.mvp?.id===player.id ? PERFORMANCE_POINTS.mvp : 0);
    total += score;
    played++;
  });
  return {total, average:total/played, matches:played};
}
function applyBookingRatings(b, roster){
  if(!b || b.ratingApplied || !Array.isArray(b.matches) || !b.matches.length) return;
  const players=[...(b.squads?.red||[]),...(b.squads?.blue||[])];
  players.forEach(player=>{
    const p=roster.find(x=>x.id===player.id);
    if(!p) return;
    const perf=calculateBookingPerformance(b,p);
    const delta=bookingRatingDelta(perf.average);
    p.rating=Math.max(40,Math.min(100,Number(p.rating||40)+delta));
    const history=Array.isArray(p.ratingHistory)?p.ratingHistory:[];
    history.push({score:perf.average, total:perf.total, matches:perf.matches, delta, bookingId:b.bookingId||null, date:new Date().toISOString()});
    p.ratingHistory=history.slice(-10);
  });
  b.ratingApplied=true;
}

// ---------- match recording ----------
async function saveMatch(data){
  const b = normalizeBooking(state.booking);
  if(!b || b.phase!=="done") return;
  if(b.matchesClosed){ alert("ماتشات الحجز ده اتقفلت خلاص."); return; }
  const currentMatches = Array.isArray(b.matches) ? b.matches : [];
  if(currentMatches.length >= 5){
    alert("الحجز ده وصل للحد الأقصى: 5 ماتشات.");
    return;
  }

  // اقرأ أحدث البيانات من Firebase قبل الإضافة عشان الإحصائيات التراكمية
  // ماتتمسحش لو جهاز تاني كان حدّثها.
  const rosterRes = await loadShared("players-roster", state.roster);
  const roster = clone(rosterRes.ok && Array.isArray(rosterRes.value) ? rosterRes.value : state.roster);
  const matchNo = currentMatches.length + 1;
  const allPlayers = [...(b.squads.red||[]), ...(b.squads.blue||[])];
  const squadIds = allPlayers.map(p=>p.id);
  squadIds.forEach(id=>{
    const p = roster.find(r=>r.id===id);
    if(p){
      p.apps = (p.apps||0) + 1;
      p.goals = (p.goals||0) + Number(data.goals[id]||0);
      p.assists = (p.assists||0) + Number(data.assists[id]||0);
      p.saves = (p.saves||0) + Number(data.saves[id]||0);
      p.penaltySaves = (p.penaltySaves||0) + Number(data.pensaves[id]||0);
      p.cleanSheets = (p.cleanSheets||0) + Number(data.cleanSheets?.[id]||0);
      p.tackles = (p.tackles||0) + Number(data.tackles?.[id]||0);
      p.missedPenalties = (p.missedPenalties||0) + Number(data.missedPenalties?.[id]||0);
      p.penaltiesConceded = (p.penaltiesConceded||0) + Number(data.penaltiesConceded?.[id]||0);
      p.yellowCards = (p.yellowCards||0) + Number(data.yellowCards?.[id]||0);
      p.redCards = (p.redCards||0) + Number(data.redCards?.[id]||0);
    }
  });

  const teamScore = team => (b.squads[team]||[]).reduce((sum,p)=>sum+Number(data.goals[p.id]||0),0);
  const mvpPlayer = calculateMVP(allPlayers, data);
  if(mvpPlayer){
    const mp=roster.find(r=>r.id===mvpPlayer.id);
    if(mp) mp.mvpMatches=(mp.mvpMatches||0)+1;
  }

  // الـRating بيتحدث مرة واحدة فقط عند إنهاء هذا الحجز، بناءً على متوسط نقاط كل ماتشات الحجز المسجلة فعليًا (1 إلى 5).

  data.mvpId = mvpPlayer ? mvpPlayer.id : null;
  const match = {
    id: uid(),
    bookingId: b.bookingId,
    matchNo,
    date: new Date().toISOString(),
    score: {red: teamScore("red"), blue: teamScore("blue")},
    data: clone(data),
    mvp: mvpPlayer ? { id:mvpPlayer.id, name:mvpPlayer.name, rating:playerMatchBaseRating(mvpPlayer,data) + PERFORMANCE_POINTS.mvp } : null,
    squads: clone(b.squads)
  };
  b.matches.push(match);

  // لو ده الماتش الخامس، الحجز خلص تلقائيًا ونعتمد MVP الحجز ونحدّث Rating مرة واحدة للحجز.
  if(b.matches.length>=5){
    b.matchesClosed=true;
    await awardBookingMVP(b, roster);
    applyBookingRatings(b, roster);
  }

  // الإحصائيات العامة = كل الحجوزات، أما match.data هنا فهي لهذا الحجز/الماتش فقط.
  state.roster = roster;
  const histRes = await loadShared("match-history", []);
  const hist = histRes.ok && Array.isArray(histRes.value) ? histRes.value : [];
  hist.unshift(match);
  state.history = hist;

  await saveShared("players-roster", roster);
  await saveShared("match-history", hist);
  state.booking = b;
  // مهم: خزّن نسخة الحجز نفسها بعد إضافة الماتش، وإلا الـpolling ممكن يرجّع
  // current-booking القديمة ويمسح الماتش من واجهة الحجز.
  await saveShared("current-booking", b);
  await archiveCompletedBooking(b);
  // إعادة الحفظ بعد الأرشفة تضمن أن current-booking تفضل متزامنة مع آخر نسخة.
  await saveShared("current-booking", b);
  state.matchForm = null;
  render();
  showToast("اتسجلت نتيجة الماتش " + matchNo + " ✅");
}

async function closeBookingMatches(){
  const b = normalizeBooking(state.booking);
  if(!b || b.phase!=="done") return;
  if(b.matchesClosed) return;
  if(!confirm("خلصتوا ماتشات الحجز ده؟ بعد التأكيد مش هتقدر تضيف ماتش خامس للحجز ده.")) return;
  b.matchesClosed = true;
  const rosterRes = await loadShared("players-roster", state.roster);
  const roster = rosterRes.ok && Array.isArray(rosterRes.value) ? clone(rosterRes.value) : clone(state.roster);
  await awardBookingMVP(b, roster);
  applyBookingRatings(b, roster);
  state.roster = roster;
  await saveShared("players-roster", roster);
  state.booking = b;
  await saveShared("current-booking", b);
  await archiveCompletedBooking(b);
  render();
  showToast("اتقفل سجل ماتشات الحجز ده ✅");
}

function isTypingActive(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  const app = document.getElementById("app");
  return (tag==="INPUT" || tag==="SELECT" || tag==="TEXTAREA") && app && app.contains(el);
}

function normalizeRoster(raw){
  const list=Array.isArray(raw)?clone(raw):[];
  return list.map(p=>{
    p=p||{};
    if(!p.id) p.id=uid();
    p.apps=Number(p.apps||0); p.goals=Number(p.goals||0); p.assists=Number(p.assists||0);
    p.saves=Number(p.saves||0); p.penaltySaves=Number(p.penaltySaves||0);
    p.yellowCards=Number(p.yellowCards||0); p.redCards=Number(p.redCards||0);
    p.mvpMatches=Number(p.mvpMatches||0); p.mvpBookings=Number(p.mvpBookings||0);
    p.cleanSheets=Number(p.cleanSheets||0); p.tackles=Number(p.tackles||0); p.missedPenalties=Number(p.missedPenalties||0); p.penaltiesConceded=Number(p.penaltiesConceded||0);
    // ترقية بيانات النجوم القديمة: كل اللاعبين يبدأون النظام الجديد من 40.
    if(Number(p.rating)<40) p.rating=40;
    p.rating=Math.max(40,Math.min(100,Number(p.rating)||40));
    p.ratingHistory=Array.isArray(p.ratingHistory)?p.ratingHistory:[];
    p.archived=!!p.archived;
    return p;
  });
}

async function pollAll(){
  const [rosterRes, bookingRes, historyRes, bookingHistoryRes] = await Promise.all([
    loadShared("players-roster", []),
    loadShared("current-booking", null),
    loadShared("match-history", []),
    loadShared("booking-history", []),
  ]);
  // only overwrite local state when the read actually succeeded —
  // never wipe local data because of a failed sync
  if(rosterRes.ok){
    const rawRoster = Array.isArray(rosterRes.value) ? rosterRes.value : [];
    const normalizedRoster = normalizeRoster(rawRoster);
    const needsMigration = rawRoster.some(p=>Number(p?.rating||0)<40 || !Array.isArray(p?.ratingHistory) || typeof p?.archived !== "boolean");
    state.roster = normalizedRoster;
    if(needsMigration && !state.rosterMigrationSaved){
      state.rosterMigrationSaved=true;
      saveShared("players-roster", normalizedRoster);
    }
  }
  if(bookingRes.ok) state.booking = normalizeBooking(bookingRes.value);
  if(historyRes.ok) state.history = historyRes.value || [];
  if(bookingHistoryRes.ok) state.bookingHistory = bookingHistoryRes.value || [];
  if(state.booking) restoreLocalTeam(state.booking);

  const anyFailed = !rosterRes.ok || !bookingRes.ok || !historyRes.ok || !bookingHistoryRes.ok;
  if(anyFailed && !storageWarnShown){
    storageWarnShown = true;
    showToast("⚠️ التزامن مع الموبايل التاني مش شغال دلوقتي — اللعب هيفضل شغال على جهازك بس");
  }

  // اللاعبين الأساسيين ثابتين دايمًا حتى لو التخزين المشترك مش شغال
  if(!state.roster || state.roster.length===0){
    state.roster = normalizeRoster(INITIAL_ROSTER);
    saveShared("players-roster", state.roster);
  }

  await checkTimeout();
  if(!isTypingActive()) render();
}

function stars(rating){
  const r=Math.max(40,Math.min(100,Number(rating)||40));
  const n = r>=90 ? 5 : r>=80 ? 4 : r>=70 ? 3 : r>=60 ? 2 : 1;
  return `<span class="stars">${"★".repeat(n)}${"☆".repeat(5-n)}</span>`;
}

function renderFinalLineups(b){
  // التشكيلة هنا شكلية فقط: كل فريق لازم يظهر في فورميشن ثابتة
  // 1 حارس + 2 دفاع + 2 وسط + 1 مهاجم، لكن مركز اللاعب الحقيقي
  // لا يفرض مكانه. بنوزع الـ6 لاعبين على الخانات بأقرب شكل ممكن
  // لمراكزهم الحقيقية، ولو المراكز متكررة عادي جدًا كل لاعب ياخد خانة مختلفة.
  const slots = [
    { key:"attack", label:"مهاجم", pos:"مهاجم" },
    { key:"mid1", label:"وسط", pos:"وسط" },
    { key:"mid2", label:"وسط", pos:"وسط" },
    { key:"def1", label:"دفاع", pos:"مدافع" },
    { key:"def2", label:"دفاع", pos:"مدافع" },
    { key:"keeper", label:"حارس", pos:"حارس مرمى" }
  ];

  function bestFormation(starters){
    // نجرب كل التوزيعات الممكنة (6! = 720 فقط) ونختار التوزيع
    // الذي يحافظ على مراكز اللاعبين الحقيقية قدر الإمكان، مع ضمان
    // امتلاء كل خانات الفورميشن دائمًا.
    let best = null;
    let bestScore = Infinity;

    function mismatchCost(player, slot){
      if(player.position === slot.pos) return 0;
      // الحارس له أولوية أكبر في الحفاظ على خانة الحراسة.
      if(player.position === "حارس مرمى" && slot.pos !== "حارس مرمى") return 8;
      if(player.position !== "حارس مرمى" && slot.pos === "حارس مرمى") return 8;
      return 1;
    }

    function permute(arr, l){
      if(l === arr.length){
        let score = 0;
        for(let i=0;i<arr.length;i++) score += mismatchCost(arr[i], slots[i]);
        if(score < bestScore){
          bestScore = score;
          best = arr.slice();
        }
        return;
      }
      for(let i=l;i<arr.length;i++){
        [arr[l],arr[i]] = [arr[i],arr[l]];
        permute(arr,l+1);
        [arr[l],arr[i]] = [arr[i],arr[l]];
      }
    }

    permute(starters.slice(),0);
    return best || starters.slice();
  }

  const teamCard = (team,label,cls)=>{
    const players = b.squads[team] || [];
    const starters = players.filter(p=>!p.isBench && !p.isFinalRoulette).slice(0, Number(b.teamSize||6));
    const bench = players.filter(p=>p.isBench || p.isFinalRoulette);
    const assigned = bestFormation(starters);
    const byKey = key => {
      const index = slots.findIndex(s=>s.key===key);
      return assigned[index] ? [assigned[index]] : [];
    };
    const names = arr => arr.length
      ? arr.map(p=>`<div class="formation-player"><span>${esc(p.name)}</span>${p.isCaptain?`<small>كابتن</small>`:`<small>${esc(p.position)}</small>`}</div>`).join("")
      : `<div class="formation-empty">—</div>`;

    return `
      <div class="formation-team ${cls}">
        <div class="formation-head"><span class="team-pill ${cls}">${label}</span></div>
        <div class="formation-pitch">
          <div class="formation-line attack">${names(byKey("attack"))}</div>
          <div class="formation-line midfield">${names(byKey("mid1"))}${names(byKey("mid2"))}</div>
          <div class="formation-line defense">${names(byKey("def1"))}${names(byKey("def2"))}</div>
          <div class="formation-line keeper">${names(byKey("keeper"))}</div>
        </div>
        ${bench.length ? `<div class="bench-box"><div class="bench-title">🪑 الدكة</div>${bench.map(p=>`<div class="formation-player bench-player"><span>${esc(p.name)}</span><small>${esc(p.position)}</small></div>`).join("")}</div>` : ""}
      </div>`;
  };

  return `
    <div class="card">
      <h3>التشكيل النهائي 🏟️</h3>
      <div style="font-size:11px;opacity:.6;margin-bottom:10px;">الخطة ثابتة شكليًا، لكن مركز اللاعب الحقيقي لا يمنع وضعه في أي خانة.</div>
      <div class="formation-grid">
        ${teamCard("red","🔴 الأحمر","red")}
        ${teamCard("blue","🔵 الأزرق","blue")}
      </div>
    </div>
  `;
}

function renderMatch(){
  const b = state.booking;
  if(!b || b.phase!=="done"){
    return `<div class="empty">لسه مفيش تشكيلة جاهزة — كمل المزاد الأول</div>`;
  }
  const allPlayers = [...b.squads.red.map(p=>({...p,team:"red"})), ...b.squads.blue.map(p=>({...p,team:"blue"}))];
  const statDefs = [
    {key:"goals", label:"هدف", icon:"⚽"},
    {key:"assists", label:"أسيست", icon:"🅰️"},
    {key:"yellowCards", label:"إنذار", icon:"🟨"},
    {key:"redCards", label:"طرد", icon:"🟥"},
    {key:"tackles", label:"بلوك", icon:"🛡️"},
    {key:"missedPenalties", label:"ضربة ضايعة", icon:"❌"},
    {key:"penaltiesConceded", label:"سبب ضربة جزاء", icon:"🚨"}
  ];
  const rows = allPlayers.map(p=>{
    const isGK = p.position === "حارس مرمى";
    const defs = isGK ? [statDefs[0],statDefs[1],statDefs[2],statDefs[3],
      {key:"saves",label:"تصدي",icon:"🧤"},
      {key:"pensaves",label:"تصدي جزاء",icon:"🥅"},
      statDefs[4],statDefs[5],statDefs[6]] : statDefs;
    const controls = defs.map(d=>{
      const val=Number(state.matchForm?.[d.key]?.[p.id]||0);
      const attr=d.key==='pensaves'?'data-pensave':d.key==='yellowCards'?'data-yellow':d.key==='redCards'?'data-red':d.key==='missedPenalties'?'data-missedpen':d.key==='penaltiesConceded'?'data-penalty-conceded':d.key==='tackles'?'data-tackle':d.key==='saves'?'data-save':d.key==='assists'?'data-assist':'data-goal';
      return `<div class="stat-control"><span class="stat-label">${d.icon} ${d.label}</span><div class="stat-actions"><button type="button" class="stat-btn minus" data-stat-minus="${d.key}" data-player="${p.id}">−</button><span class="stat-value" ${attr}="${p.id}" data-stat-value="${d.key}" data-player="${p.id}">${val}</span><button type="button" class="stat-btn plus" data-stat-plus="${d.key}" data-player="${p.id}">+</button></div></div>`;
    }).join('');
    const pts=playerMatchRating(p,state.matchForm||{});
    return `<div class="match-player-card"><div class="match-player-head"><div><div class="match-player-name">${esc(p.name)} <span class="team-pill ${p.team}" style="margin-right:5px;">${p.team==='red'?'أحمر':'أزرق'}</span></div><div class="match-player-meta">${esc(p.position)}</div></div><div class="player-points" data-player-points="${p.id}">${pts>0?'+':''}${pts} نقطة</div></div><div class="stat-grid">${controls}</div></div>`;
  }).join('');

  const matches = Array.isArray(b.matches) ? b.matches : [];
  const matchCards = matches.map(m=>{
    const red = Number(m.score?.red||0), blue = Number(m.score?.blue||0);
    const goalRows = [];
    const goals = (m.data && m.data.goals) || {};
    Object.entries(goals).forEach(([id,val])=>{
      const n=Number(val||0); if(n<=0) return;
      const p=state.roster.find(x=>x.id===id) || allPlayers.find(x=>x.id===id);
      if(p) goalRows.push(`${esc(p.name)} ×${n}`);
    });
    const mvpHtml = m.mvp?.name ? `<div style="margin-top:8px;text-align:center;font-weight:800;color:var(--gold);">🏆 MVP: ${esc(m.mvp.name)} <span style="font-size:11px;opacity:.75;">(${Number(m.mvp.rating||0)} نقطة)</span></div>` : '';
    const d=m.data||{};
    const statBits=[];
    const addStats=(key,label,icon)=>Object.entries(d[key]||{}).forEach(([id,v])=>{const n=Number(v||0);if(n){const p=state.roster.find(x=>x.id===id)||allPlayers.find(x=>x.id===id);if(p) statBits.push(`${esc(p.name)} ${icon}${n}`);}});
    addStats('cleanSheets','كلين شيت','🧱'); addStats('tackles','تاكلينج','🦵'); addStats('missedPenalties','ضربة ضايعة','❌');
    const extraStats=statBits.length?`<div style="font-size:11px;opacity:.65;margin-top:4px;">${statBits.join(' · ')}</div>`:'';
    return `<div class="card" style="margin-bottom:8px;background:rgba(255,255,255,.025);"><h3 style="margin-bottom:5px;">نتيجة الماتش ${m.matchNo}</h3><div style="font-family:'Cairo',sans-serif;font-size:20px;text-align:center;margin:6px 0;">🔴 ${red} &nbsp; - &nbsp; ${blue} 🔵</div><div style="font-size:11px;opacity:.65;">${goalRows.length ? 'الأهداف: '+goalRows.join('، ') : 'مفيش أهداف مسجلة'}</div>${extraStats}${mvpHtml}</div>`;
  }).join("");

  const totalMatches = matches.length;
  const bookingStats = {};
  allPlayers.forEach(p=>bookingStats[p.id]={name:p.name,goals:0,assists:0,saves:0,penaltySaves:0,cleanSheets:0,tackles:0,missedPenalties:0,penaltiesConceded:0,yellowCards:0,redCards:0,points:0,mvpMatches:0});
  matches.forEach(m=>{
    Object.entries(m.data?.goals||{}).forEach(([id,v])=>{ if(bookingStats[id]) bookingStats[id].goals+=Number(v||0); });
    Object.entries(m.data?.assists||{}).forEach(([id,v])=>{ if(bookingStats[id]) bookingStats[id].assists+=Number(v||0); });
    Object.entries(m.data?.saves||{}).forEach(([id,v])=>{ if(bookingStats[id]) bookingStats[id].saves+=Number(v||0); });
    Object.entries(m.data?.pensaves||{}).forEach(([id,v])=>{ if(bookingStats[id]) bookingStats[id].penaltySaves+=Number(v||0); });
    Object.entries(m.data?.cleanSheets||{}).forEach(([id,v])=>{ if(bookingStats[id]) bookingStats[id].cleanSheets+=Number(v||0); });
    Object.entries(m.data?.tackles||{}).forEach(([id,v])=>{ if(bookingStats[id]) bookingStats[id].tackles+=Number(v||0); });
    Object.entries(m.data?.missedPenalties||{}).forEach(([id,v])=>{ if(bookingStats[id]) bookingStats[id].missedPenalties+=Number(v||0); });
    Object.entries(m.data?.penaltiesConceded||{}).forEach(([id,v])=>{ if(bookingStats[id]) bookingStats[id].penaltiesConceded+=Number(v||0); });
    Object.entries(m.data?.yellowCards||{}).forEach(([id,v])=>{ if(bookingStats[id]) bookingStats[id].yellowCards+=Number(v||0); });
    Object.entries(m.data?.redCards||{}).forEach(([id,v])=>{ if(bookingStats[id]) bookingStats[id].redCards+=Number(v||0); });
    allPlayers.forEach(p=>{ if(bookingStats[p.id]) bookingStats[p.id].points += playerMatchRating(p,m.data||{}); });
    if(m.mvp?.id && bookingStats[m.mvp.id]) bookingStats[m.mvp.id].mvpMatches++;
  });
  const bookingMvp = calculateBookingMVP(b);
  const bookingStatRows = Object.values(bookingStats).sort((a,b)=>b.points-a.points).map(x=>`<div class="player-row"><div class="info"><div class="name">${esc(x.name)} ${bookingMvp?.id===allPlayers.find(p=>p.name===x.name)?.id?'<span style="color:var(--gold);font-weight:800;">🏆 MVP الحجز</span>':''}</div><div style="font-size:11px;opacity:.65;">${x.points} نقطة · ${x.mvpMatches} MVP ماتش</div></div><div style="font-size:11px;text-align:left;">${x.goals?x.goals+' ⚽ ':''}${x.assists?x.assists+' 🅰️ ':''}${x.saves?x.saves+' 🧤 ':''}${x.penaltySaves?x.penaltySaves+' 🥅 ':''}${x.cleanSheets?x.cleanSheets+' 🧱 ':''}${x.tackles?x.tackles+' 🛡️ ':''}${x.missedPenalties?x.missedPenalties+' ❌ ':''}${x.penaltiesConceded?x.penaltiesConceded+' 🚨 ':''}${x.yellowCards?x.yellowCards+' 🟨 ':''}${x.redCards?x.redCards+' 🟥':''}</div></div>`).join("");

  const canRepeatCurrent = b.squads.red.length===6 && b.squads.blue.length===6;
  const repeatCurrentHtml = canRepeatCurrent ? `<button class="btn ghost" id="repeat-current-booking-btn" style="margin-top:10px;">🔄 اعمل حجز تاني بنفس التشكيلة</button>` : "";

  const currentForm = state.matchForm || {};
  const totalFormPoints = allPlayers.reduce((sum,p)=>sum+playerMatchRating(p,currentForm),0);
  const redGoals = (b.squads.red||[]).reduce((sum,p)=>sum+Number(currentForm.goals?.[p.id]||0),0);
  const blueGoals = (b.squads.blue||[]).reduce((sum,p)=>sum+Number(currentForm.goals?.[p.id]||0),0);

  return `
    <div class="card"><div class="results-header"><h3>📊 تسجيل نتيجة الماتش</h3><span class="team-pill" style="background:rgba(232,185,35,.12);color:var(--gold);">ماتش ${totalMatches+1}</span></div><p class="results-note">اختار الإحصائية بالزرار بدل الكتابة. كل ضغطة + تزود واحدة، و− تقلل واحدة.</p><div class="match-summary"><div class="summary-box"><div class="value">${redGoals}</div><div class="label">🔴 أهداف الأحمر</div></div><div class="summary-box"><div class="value">${blueGoals}</div><div class="label">🔵 أهداف الأزرق</div></div><div class="summary-box"><div class="value">${totalFormPoints>0?'+':''}${totalFormPoints}</div><div class="label">إجمالي النقاط</div></div></div><div style="font-size:10.5px;opacity:.58;margin:5px 0 10px;line-height:1.7;">⚽ +3 · 🅰️ +2 · 🧤 +1 · 🥅 +3 · 🧱 كلين شيت +2 · 🛡️ بلوك +2 · 🏆 MVP +3 · ❌ −3 · 🚨 تسبب في ضربة جزاء −2 · 🟨 −1 · 🟥 −3</div>${b.matchesClosed ? `<div style="font-size:13px;color:var(--gold);font-weight:700;margin:10px 0;">🔒 تم إنهاء ماتشات الحجز ده — لعبتوا ${totalMatches} ماتش.</div>` : `${rows}<button class="btn" id="save-match-btn" style="margin-top:12px;" ${totalMatches>=5?'disabled':''}>${totalMatches>=5?'اكتمل 5 ماتشات':'احفظ نتيجة الماتش '+(totalMatches+1)}</button>${totalMatches<5 ? `<button class="btn ghost" id="close-booking-matches-btn" style="margin-top:8px;">خلصنا الماتشات — إنهاء الحجز بدون لعب ${totalMatches+1}</button>` : ``}`}</div>
    <div class="card"><h3>ماتشات الحجز ده</h3>${matchCards || '<div style="opacity:.5;font-size:12px;">لسه مفيش ماتشات متسجلة</div>'}</div>
    <div class="card"><h3>🏆 MVP الحجز بالكامل</h3>${bookingMvp ? `<div style="text-align:center;font-size:17px;font-weight:900;color:var(--gold);">${esc(bookingMvp.name)}</div><div style="text-align:center;font-size:12px;opacity:.7;margin-top:4px;">${Number(bookingMvp.rating||0)} نقطة إجمالي الحجز</div>` : '<div style="opacity:.5;font-size:12px;text-align:center;">لسه مفيش MVP للحجز — لازم يكون فيه نقاط موجبة.</div>'}</div>
    <div class="card"><h3>إحصائيات الحجز ده</h3><div style="font-size:12px;opacity:.6;margin-bottom:8px;">إجمالي كل الماتشات داخل الحجز + مجموع نقاط MVP لكل لاعب. والـRating بيتحدث مرة واحدة عند إنهاء الحجز بناءً على متوسط نقاط ماتشاته.</div>${bookingStatRows || '<div style="opacity:.5;font-size:12px;">لسه مفيش إحصائيات</div>'}</div>
    ${repeatCurrentHtml ? `<div class="card"><h3>نفس التشكيلة</h3><p style="font-size:12px;opacity:.65;margin-top:-4px;">لو هتلعبوا حجز كمان بنفس الفريقين، مش محتاجين تعملوا مزاد جديد.</p>${repeatCurrentHtml}</div>` : ""}
  `;
}

function renderBookingHistory(){
  // تاريخ مستقل لكل حجز: لا يعتمد على كون الحجز الحالي ظاهر في تاب النتائج.
  const current = state.booking && state.booking.phase === "done" ? state.booking : null;
  const archived = Array.isArray(state.bookingHistory) ? state.bookingHistory : [];
  const items = archived.map(h=>h && h.id ? h : null).filter(Boolean);
  if(current && !items.some(h=>h.id===current.bookingId)){
    items.unshift({
      id: current.bookingId,
      number: current.bookingNumber,
      date: current.completedAt || new Date().toISOString(),
      captainRed: current.captainRed,
      captainBlue: current.captainBlue,
      squads: clone(current.squads),
      log: clone(current.log||[]),
      matches: clone(current.matches||[]),
      bookingMvp: clone(current.bookingMvp||null),
      bookingMvpAwarded: !!current.bookingMvpAwarded
    });
  }
  items.sort((a,b)=>Number(b.number||0)-Number(a.number||0));

  const playerName = id => {
    const p = state.roster.find(x=>x.id===id);
    return p ? p.name : id;
  };
  const teamNames = arr => (arr||[]).map(p=>esc(p.name || playerName(p.id))).join("، ");
  const eventText = e => {
    if(typeof e === "string") return esc(e);
    if(!e) return "";
    return esc(e.text || e.message || e.action || JSON.stringify(e));
  };
  const statLine = (m) => {
    const parts=[];
    const add=(obj,label,icon)=>Object.entries(obj||{}).forEach(([id,v])=>{const n=Number(v||0);if(n>0)parts.push(`${esc(playerName(id))} ${icon}${n}${label?" "+label:""}`);});
    add(m.data?.goals,"","⚽");
    add(m.data?.assists,"","🅰️");
    add(m.data?.saves,"","🧤");
    add(m.data?.pensaves,"جزاء","🧤");
    add(m.data?.yellowCards,"","🟨");
    add(m.data?.redCards,"","🟥");
    if(m.mvp?.name) parts.push(`🏆 MVP: ${esc(m.mvp.name)} (${Number(m.mvp.rating||0)} نقطة)`);
    return parts.length ? parts.join(" · ") : "مفيش أحداث فردية مسجلة";
  };
  const cards = items.map(h=>{
    const ms = Array.isArray(h.matches)?h.matches:[];
    const red = h.squads?.red || [], blue = h.squads?.blue || [];
    const bookingMvp = calculateBookingMVP({squads:h.squads,matches:ms});
    const matchHtml = ms.length ? ms.map(m=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--line);">
        <div style="font-weight:800;">الماتش ${m.matchNo}: 🔴 ${Number(m.score?.red||0)} - ${Number(m.score?.blue||0)} 🔵</div>
        <div style="font-size:11px;opacity:.75;margin-top:5px;">${statLine(m)}</div>
      </div>`).join("") : '<div style="opacity:.5;font-size:12px;">مفيش ماتشات متسجلة</div>';
    const logHtml = (h.log||[]).length ? `<details style="margin-top:10px;" data-booking-auction-events-id="${esc(h.id)}" ${state.openBookingAuctionEventsId===h.id ? "open" : ""}><summary style="cursor:pointer;font-weight:700;">أحداث المزاد</summary><div style="font-size:11px;opacity:.75;margin-top:7px;">${(h.log||[]).map(eventText).filter(Boolean).join("<br>")}</div></details>` : "";
    return `<details class="card" data-booking-history-id="${esc(h.id)}" ${state.openBookingHistoryId===h.id ? "open" : ""} style="margin-bottom:10px;">
      <summary style="cursor:pointer;list-style:none;">
        <div style="font-weight:900;color:var(--gold);font-size:16px;">حجز #${h.number||"؟"}</div>
        <div style="font-size:11px;opacity:.65;margin-top:3px;">${h.date ? new Date(h.date).toLocaleString('ar-EG') : ""} · ${ms.length} ماتش</div>
      </summary>
      <div style="margin-top:12px;">
        <div class="card" style="margin:0 0 8px;background:rgba(255,255,255,.025);">
          <div style="font-weight:800;margin-bottom:5px;">التشكيلتين</div>
          <div style="font-size:12px;line-height:1.8;">🔴 <b>الأحمر:</b> ${teamNames(red)}<br>🔵 <b>الأزرق:</b> ${teamNames(blue)}</div>
        </div>
        <div class="card" style="margin:0 0 8px;background:rgba(255,255,255,.025);">
          <div style="font-weight:800;margin-bottom:5px;">نتايج الماتشات وأحداثها</div>
          ${matchHtml}
        </div>
        ${bookingMvp ? `<div class="card" style="margin:0 0 8px;background:rgba(255,255,255,.025);text-align:center;"><div style="font-weight:900;color:var(--gold);">🏆 MVP الحجز بالكامل: ${esc(bookingMvp.name)}</div><div style="font-size:11px;opacity:.7;margin-top:3px;">${Number(bookingMvp.rating||0)} نقطة</div></div>` : ''}
        ${logHtml}
        <button class="btn ghost" style="margin-top:10px;" data-repeat-booking="${esc(h.id)}">🔄 استخدم نفس التشكيلة في حجز جديد</button>
      </div>
    </details>`;
  }).join("");

  return `<div class="card">
    <h3>📚 تاريخ الحجوزات</h3>
    <p style="font-size:12px;opacity:.65;margin-top:-4px;">هنا كل حجز قديم محفوظ لوحده: التشكيلتين، نتائج كل الماتشات، والأحداث والإحصائيات المسجلة وقت الحجز.</p>
  </div>${cards || '<div class="card"><div style="opacity:.5;font-size:12px;">لسه مفيش حجوزات محفوظة.</div></div>'}`;
}

function renderStats(){
  const sorted = [...state.roster].sort((a,b)=> ((b.goals||0)-(a.goals||0)) || ((b.apps||0)-(a.apps||0)));
  const rows = sorted.map(p=>{
    const isGK = p.position === "حارس مرمى";
    return `
    <div class="player-row">
      <div class="info">
        <div class="name">${esc(p.name)}</div>
        <div class="meta">${esc(p.position)} · Rating ${Number(p.rating||40)} · ${stars(p.rating)} · ${p.apps||0} ماتش</div>
      </div>
      <div style="text-align:left;font-family:'Cairo',sans-serif;">
        <div style="font-weight:800;color:var(--gold);">${p.goals||0} ⚽ &nbsp; ${p.assists||0} 🅰️</div>
        ${isGK ? `<div style="font-size:11px;opacity:.6;">${p.saves||0} 🧤 &nbsp; ${p.penaltySaves||0} 🥅</div>` : ``}
        <div style="font-size:11px;opacity:.6;">${p.yellowCards||0} 🟨 &nbsp; ${p.redCards||0} 🟥</div>
        <div style="font-size:11px;color:var(--gold);font-weight:700;">🏆 ${p.mvpMatches||0} MVP ماتش &nbsp; · &nbsp; ${p.mvpBookings||0} MVP حجز</div>
      </div>
    </div>
  `;
  }).join("");
  return `
    <div class="card">
      <h3>إحصائيات اللاعبين</h3>
      ${state.roster.length ? rows : `<div class="empty">لسه مفيش بيانات</div>`}
    </div>
  `;
}

// ---------- event binding ----------
function bindTabEvents(){
  const nameEl = document.getElementById("p-name");
  const addBtn = document.getElementById("add-player-btn");
  if(addBtn){
    addBtn.onclick = ()=>{
      const name = document.getElementById("p-name").value;
      const pos = document.getElementById("p-pos").value;
      addPlayer(name, pos);
    };
  }
  document.querySelectorAll("[data-del]").forEach(b=>{
    b.onclick = ()=> deletePlayer(b.dataset.del);
  });
  document.querySelectorAll("[data-restore-player]").forEach(b=>{
    b.onclick = ()=> restorePlayer(b.dataset.restorePlayer);
  });

  const startBtn = document.getElementById("start-booking-btn");
  if(startBtn) startBtn.onclick = ()=> startBooking(DEFAULT_QUOTA);

  document.querySelectorAll("[data-present-player]").forEach(inp=>{
    inp.onchange = ()=>{
      const id=inp.dataset.presentPlayer;
      const set=new Set(state.attendanceSelectedIds||[]);
      if(inp.checked) set.add(id); else set.delete(id);
      state.attendanceSelectedIds=[...set];
      render();
    };
  });
  const confirmAttendanceBtn=document.getElementById("confirm-attendance-btn");
  if(confirmAttendanceBtn) confirmAttendanceBtn.onclick=confirmAttendance;
  const cancelAttendanceBtn=document.getElementById("cancel-attendance-btn");
  if(cancelAttendanceBtn) cancelAttendanceBtn.onclick=cancelAttendanceSelection;

  const cancelBtn = document.getElementById("cancel-booking-btn");
  if(cancelBtn) cancelBtn.onclick = ()=> cancelCurrentBooking();


  document.querySelectorAll("[data-booking-history-id]").forEach(details=>{
    details.addEventListener("toggle", ()=>{
      if(details.open) state.openBookingHistoryId = details.dataset.bookingHistoryId;
      else if(state.openBookingHistoryId === details.dataset.bookingHistoryId) state.openBookingHistoryId = null;
    });
  });

  document.querySelectorAll("[data-booking-auction-events-id]").forEach(details=>{
    details.addEventListener("toggle", ()=>{
      if(details.open) state.openBookingAuctionEventsId = details.dataset.bookingAuctionEventsId;
      else if(state.openBookingAuctionEventsId === details.dataset.bookingAuctionEventsId) state.openBookingAuctionEventsId = null;
    });
  });

  document.querySelectorAll("[data-repeat-booking]").forEach(btn=>{
    btn.onclick = ()=>{
      const source = (state.bookingHistory || []).find(x=>x && x.id===btn.dataset.repeatBooking);
      if(source) startRepeatedBooking(source);
      else alert("الحجز ده مش موجود في الهيستوري دلوقتي — اعمل تحديث وجرب تاني.");
    };
  });

  const repeatCurrentBtn = document.getElementById("repeat-current-booking-btn");
  if(repeatCurrentBtn) repeatCurrentBtn.onclick = ()=>{
    if(confirm("تعمل حجز جديد بنفس التشكيلة دي من غير مزاد؟")){
      startRepeatedBooking({
        id: state.booking.bookingId,
        number: state.booking.bookingNumber,
        captainRed: state.booking.captainRed,
        captainBlue: state.booking.captainBlue,
        squads: state.booking.squads
      });
    }
  };

  const pickRed = document.getElementById("pick-red");
  const pickBlue = document.getElementById("pick-blue");
  if(pickRed) pickRed.onclick = ()=>{ state.myTeam="red"; render(); };
  if(pickBlue) pickBlue.onclick = ()=>{ state.myTeam="blue"; render(); };

  document.querySelectorAll("[data-pick-captain]").forEach(btn=>{
    if(btn.disabled) return;
    btn.onclick = ()=> chooseCaptain(btn.dataset.pickCaptain);
  });

  const submitBid = document.getElementById("submit-bid-btn");
  if(submitBid){
    submitBid.onclick = ()=>{
      const val = parseInt(document.getElementById("bid-input").value,10);
      if(!val){ alert("اكتب رقم"); return; }
      placeBid(val);
    };
  }
  const concedeBtn = document.getElementById("concede-btn");
  if(concedeBtn) concedeBtn.onclick = concedePlayer;

  const finalRouletteBtn = document.getElementById("final-roulette-btn");
  if(finalRouletteBtn) finalRouletteBtn.onclick = runFinalRoulette;

  const closeBookingBtn = document.getElementById("close-booking-matches-btn");
  if(closeBookingBtn) closeBookingBtn.onclick = closeBookingMatches;

  const saveMatchBtn = document.getElementById("save-match-btn");
  if(saveMatchBtn){
    saveMatchBtn.onclick = ()=>{
      // خُد Snapshot من الخانات فورًا قبل أي await أو polling، عشان القيم ما تضيعش.
      const goals={}, assists={}, saves={}, pensaves={}, yellowCards={}, redCards={}, tackles={}, missedPenalties={}, penaltiesConceded={}, cleanSheets={};
      document.querySelectorAll("[data-stat-value]").forEach(el=>{
        const key=el.dataset.statValue, id=el.dataset.player, value=Number(el.textContent||0);
        if(key==='goals') goals[id]=value;
        else if(key==='assists') assists[id]=value;
        else if(key==='saves') saves[id]=value;
        else if(key==='pensaves') pensaves[id]=value;
        else if(key==='yellowCards') yellowCards[id]=value;
        else if(key==='redCards') redCards[id]=value;
        else if(key==='tackles') tackles[id]=value;
        else if(key==='missedPenalties') missedPenalties[id]=value;
        else if(key==='penaltiesConceded') penaltiesConceded[id]=value;
      });
      const teamScore = team => (state.booking?.squads?.[team]||[]).reduce((sum,p)=>sum+Number(goals[p.id]||0),0);
      const redScore=teamScore("red"), blueScore=teamScore("blue");
      (state.booking?.squads?.red||[]).forEach(p=>{ cleanSheets[p.id] = blueScore===0 ? 1 : 0; });
      (state.booking?.squads?.blue||[]).forEach(p=>{ cleanSheets[p.id] = redScore===0 ? 1 : 0; });
      state.matchForm = {goals, assists, saves, pensaves, yellowCards, redCards, tackles, missedPenalties, penaltiesConceded, cleanSheets};
      saveMatchBtn.disabled = true;
      saveMatch({ goals, assists, saves, pensaves, yellowCards, redCards, tackles, missedPenalties, penaltiesConceded, cleanSheets });
    };
  }

  // أزرار +/−: كل ضغطة تعدّل الرقم محليًا، والـpolling يعيد الرسم من state.matchForm.
  const ensureForm = ()=>{
    if(!state.matchForm) state.matchForm = {goals:{}, assists:{}, saves:{}, pensaves:{}, yellowCards:{}, redCards:{}, tackles:{}, missedPenalties:{}, penaltiesConceded:{}, cleanSheets:{}};
    return state.matchForm;
  };
  const updateStat = (key,id,delta)=>{
    const form=ensureForm();
    const current=Number(form[key]?.[id]||0);
    const next=Math.max(0,current+delta);
    if(!form[key]) form[key]={};
    form[key][id]=next;
    const el=document.querySelector(`[data-stat-value="${key}"][data-player="${id}"]`);
    if(el) el.textContent=String(next);
    const player=allPlayers.find(x=>x.id===id);
    const ptsEl=document.querySelector(`[data-player-points="${id}"]`);
    if(player && ptsEl){const pts=playerMatchRating(player,form);ptsEl.textContent=(pts>0?'+':'')+pts+' نقطة';}
    const redGoals=(b.squads.red||[]).reduce((sum,p)=>sum+Number(form.goals?.[p.id]||0),0);
    const blueGoals=(b.squads.blue||[]).reduce((sum,p)=>sum+Number(form.goals?.[p.id]||0),0);
    const boxes=document.querySelectorAll('.summary-box .value');
    if(boxes[0]) boxes[0].textContent=redGoals;
    if(boxes[1]) boxes[1].textContent=blueGoals;
    const totalPts=allPlayers.reduce((sum,p)=>sum+playerMatchRating(p,form),0);
    if(boxes[2]) boxes[2].textContent=(totalPts>0?'+':'')+totalPts;
  };
  document.querySelectorAll('[data-stat-plus]').forEach(btn=>btn.addEventListener('click',()=>updateStat(btn.dataset.statPlus,btn.dataset.player,1)));
  document.querySelectorAll('[data-stat-minus]').forEach(btn=>btn.addEventListener('click',()=>updateStat(btn.dataset.statMinus,btn.dataset.player,-1)));

}

// ---------- init ----------
async function init(){
  await pollAll();
  pollTimer = setInterval(pollAll, 1500);
}
init();

})();
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}
</script>
